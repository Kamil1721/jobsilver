<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="lightMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F0F0"/>
      <stop offset="50%" stop-color="#C8C8C8"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="50%" stop-color="#2A2A2A"/>
      <stop offset="100%" stop-color="#3A3A3A"/>
    </linearGradient>
  </defs>
  
  <!-- Outer square frame -->
  <rect x="4" y="4" width="92" height="92" fill="url(#darkMetal)"/>
  
  <!-- Inner cutout -->
  <rect x="10" y="10" width="80" height="80" fill="url(#lightMetal)"/>
  
  <!-- J - bold geometric -->
  <path d="M22 20 L42 20 L42 58 Q42 68 32 68 L22 68 L22 58 L30 58 Q32 58 32 56 L32 30 L22 30 Z" 
        fill="url(#darkMetal)"/>
  
  <!-- S - sharp geometric, overlapping J space -->
